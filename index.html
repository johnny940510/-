<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SQUAT HERO PRO - 全身偵測版</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

    <style>
        :root { --primary: #4ade80; --secondary: #facc15; --danger: #ff4757; --bg: #0f172a; --card: rgba(30, 41, 59, 0.7); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); color: white; font-family: sans-serif; overflow: hidden; }
        .app { height: 100%; display: flex; flex-direction: column; max-width: 500px; margin: 0 auto; }
        .screen { display: none; height: 100%; flex-direction: column; padding: 12px; }
        .screen.active { display: flex; }

        /* 開始畫面 */
        #start-screen { align-items: center; justify-content: center; background: radial-gradient(circle, #1e293b 0%, #0f172a 100%); }
        .card { background: var(--card); backdrop-filter: blur(10px); padding: 30px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); text-align: center; width: 90%; }
        .btn { width: 100%; padding: 18px; background: var(--primary); border: none; border-radius: 50px; font-weight: bold; font-size: 18px; color: #0f172a; cursor: pointer; }

        /* 遊戲排版 */
        .camera-section { flex: 4; position: relative; margin-bottom: 8px; }
        .camera-container { width: 100%; height: 100%; background: #000; border-radius: 20px; overflow: hidden; border: 2px solid #334155; }
        video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        #hint-display { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); padding: 8px 20px; border-radius: 30px; font-size: 14px; color: white; border: 1px solid var(--primary); white-space: nowrap; z-index: 10; transition: 0.3s; }
        .hint-warning { border-color: var(--danger) !important; color: var(--danger) !important; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
        .stat-item { background: var(--card); padding: 10px; border-radius: 16px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .value { color: var(--secondary); font-size: 22px; font-weight: bold; display: block; }
        .label { font-size: 10px; color: #94a3b8; }

        .battle-section { flex: 3; background: var(--card); border-radius: 20px; padding: 15px; display: flex; flex-direction: column; }
        .battle-stage { flex: 1; position: relative; background: #020617; border-radius: 15px; overflow: hidden; }
        .character { position: absolute; bottom: 15px; font-size: 60px; transition: 0.2s; }
        #player { left: 20px; } #monster { right: 20px; }

        .hp-bar { width: 100%; height: 12px; background: #1e293b; border-radius: 6px; margin-top: 10px; overflow: hidden; border: 1px solid #334155; }
        #hp-fill { width: 100%; height: 100%; background: var(--danger); transition: 0.4s; }
    </style>
</head>
<body>

    <div class="app">
        <section id="start-screen" class="screen active">
            <div class="card">
                <h1 style="color:var(--primary)">🏋️ SQUAT HERO</h1>
                <p style="color:#94a3b8; font-size:14px; margin-bottom:20px;">請將手機放遠，直到看到全身</p>
                <button id="start-btn" class="btn">開始挑戰</button>
            </div>
        </section>

        <section id="game-screen" class="screen">
            <div class="camera-section">
                <div class="camera-container">
                    <video id="webcam" playsinline muted autoplay></video>
                    <canvas id="output_canvas"></canvas>
                    <div id="hint-display">正在啟動相機...</div>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-item"><span class="label">STAGE</span><span id="ui-stage" class="value">1</span></div>
                <div class="stat-item"><span class="label">SCORE</span><span id="ui-score" class="value">0</span></div>
                <div class="stat-item"><span class="label">COUNT</span><span id="ui-count" class="value">0</span></div>
            </div>

            <div class="battle-section">
                <div class="battle-stage">
                    <div id="player" class="character">👤</div>
                    <div id="monster" class="character">👾</div>
                </div>
                <div class="hp-bar"><div id="hp-fill"></div></div>
                <p style="text-align:center; font-size:11px; color:#94a3b8; margin:5px 0 0 0;">BOSS HEALTH</p>
            </div>
        </section>
    </div>

    <script>
        const state = { stage: 1, score: 0, count: 0, hp: 100, isSquatting: false };
        const video = document.getElementById('webcam');
        const hint = document.getElementById('hint-display');

        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            minDetectionConfidence: 0.7, // 提高信心門檻
            minTrackingConfidence: 0.7
        });

        pose.onResults((results) => {
            const canvas = document.getElementById('output_canvas');
            const ctx = canvas.getContext('2d');
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (results.poseLandmarks) {
                // 取得關鍵點
                const hip = results.poseLandmarks[23];  // 髖
                const knee = results.poseLandmarks[25]; // 膝
                const ankle = results.poseLandmarks[27]; // 踝

                // --- 核心修改：全身檢核邏輯 ---
                // 只有當膝蓋和踝關節的偵測信心度都高時，才進行判斷
                const isFullBodyVisible = knee.visibility > 0.6 && ankle.visibility > 0.6;

                if (!isFullBodyVisible) {
                    hint.innerText = "⚠️ 請再後退一點，需拍到膝蓋與腳踝";
                    hint.classList.add('hint-warning');
                    drawConnectors(ctx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#ff4757', lineWidth: 2});
                } else {
                    hint.classList.remove('hint-warning');
                    drawConnectors(ctx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#4ade80', lineWidth: 4});
                    
                    const angle = calculateAngle(hip, knee, ankle);
                    
                    // 偵測深蹲動作 (角度小於 110 度算蹲下，大於 150 度算站起)
                    if (angle < 110 && !state.isSquatting) {
                        state.isSquatting = true;
                        document.getElementById('player').style.transform = "scaleY(0.7) translateY(15px)";
                        hint.innerText = "✅ 蹲下成功！快站起來！";
                    } else if (angle > 155 && state.isSquatting) {
                        state.isSquatting = false;
                        document.getElementById('player').style.transform = "scaleY(1) translateY(0)";
                        hint.innerText = "💥 站立攻擊成功！";
                        attack();
                    } else if (!state.isSquatting) {
                        hint.innerText = "💪 請準備深蹲 (目前的膝蓋角度: " + Math.round(angle) + "°)";
                    }
                }
            } else {
                hint.innerText = "❌ 找不到人體，請退後";
                hint.classList.add('hint-warning');
            }
            ctx.restore();
        });

        function attack() {
            state.count++; state.score += 150; state.hp -= 20;
            const monster = document.getElementById('monster');
            monster.style.transform = "translateX(20px) scale(1.2)";
            setTimeout(() => monster.style.transform = "translateX(0) scale(1)", 150);
            if (state.hp <= 0) { state.hp = 100; state.stage++; alert("擊敗魔王！進入第 " + state.stage + " 關"); }
            updateUI();
        }

        function updateUI() {
            document.getElementById('ui-stage').innerText = state.stage;
            document.getElementById('ui-score').innerText = state.score;
            document.getElementById('ui-count').innerText = state.count;
            document.getElementById('hp-fill').style.width = state.hp + "%";
        }

        function calculateAngle(A, B, C) {
            let rad = Math.atan2(C.y - B.y, C.x - B.x) - Math.atan2(A.y - B.y, A.x - B.x);
            let ang = Math.abs(rad * 180.0 / Math.PI);
            if (ang > 180.0) ang = 360 - ang;
            return ang;
        }

        document.getElementById('start-btn').onclick = async function() {
            document.getElementById('start-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            const camera = new Camera(video, {
                onFrame: async () => { await pose.send({image: video}); },
                width: 640, height: 480
            });
            camera.start();
        };
    </script>
</body>
</html>
