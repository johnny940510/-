<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>深蹲 RPG - 聖光騎士遠征</title>
  
  <!-- 引入 MediaPipe Pose 與 相機工具 -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --primary: #38bdf8;
      --accent: #eab308;
      --text: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #app {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 850px;
      background: #111827;
      position: relative;
      display: flex;
      flex-direction: column;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    /* 頂部資訊欄 */
    header {
      background: var(--card-bg);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      z-index: 10;
    }

    .user-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .user-name { font-weight: bold; color: var(--primary); }
    .user-level { font-size: 0.8rem; color: #94a3b8; }
    .coins { font-weight: bold; color: var(--accent); }

    /* 畫面切換控制 */
    .screen {
      display: none;
      flex: 1;
      padding: 16px;
      flex-direction: column;
      overflow-y: auto;
    }

    .screen.active {
      display: flex;
    }

    /* 通用按鈕與卡片 */
    button {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #0369a1; }
    button:disabled { background: #475569; cursor: not-allowed; }

    .small-btn { padding: 6px 12px; font-size: 0.85rem; }

    .feature-card, .shop-item-card {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #334155;
    }

    /* 輸入框 */
    input[type="text"] {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      margin-bottom: 12px;
    }

    /* 遠征提示 */
    .walk-msg { font-size: 0.85rem; color: #94a3b8; margin-top: 4px; }
    .walk-msg.ok { color: #4ade80; }
    .walk-msg.warn { color: #f87171; }

    /* 戰鬥畫面與畫布覆蓋 */
    .battle-container {
      position: relative;
      width: 100%;
      height: 320px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    #webcam, #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #canvas { z-index: 2; }

    .hp-bar-bg {
      width: 100%;
      height: 16px;
      background: #334155;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 6px;
    }

    .hp-bar-fill {
      height: 100%;
      background: #ef4444;
      width: 100%;
      transition: width 0.2s;
    }

    .floating-dmg {
      font-size: 1.5rem;
      font-weight: bold;
      color: #f87171;
      text-align: center;
      min-height: 2rem;
    }
  </style>
</head>
<body>

<div id="app">
  <!-- 頂部狀態列 -->
  <header>
    <div class="user-info">
      <span class="user-name" id="lobbyName">勇者</span>
      <span class="user-level" id="playerLevelText">LV.1 聖殿騎士</span>
    </div>
    <div class="coins" id="coinText">🪙 1200</div>
  </header>

  <!-- 1. 登入畫面 -->
  <div id="loginScreen" class="screen active">
    <h2 style="margin-bottom: 16px; text-align: center;">🛡️ 深蹲 RPG 聖光遠征</h2>
    <input type="text" id="nameInput" placeholder="請輸入勇者名字..." />
    <button id="startBtn">進入冒險</button>
  </div>

  <!-- 2. 大廳畫面 -->
  <div id="lobbyScreen" class="screen">
    <h3>⚔️ 冒險者大廳</h3>
    <div class="feature-card" style="flex-direction: column; align-items: flex-start; margin-top: 12px;">
      <div>🚶 GPS 遠征累積：<strong id="lobbyWalkDist">0.00</strong> km</div>
      <div>⚡ 當前移動時速：<span id="lobbyWalkSpeed">0.0</span> km/h</div>
      <div id="lobbyWalkMsg" class="walk-msg">💤 原地休憩中</div>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px;">
      <button onclick="openMap()">⚔️ 進入地城</button>
      <button onclick="openRole()">🔨 鐵匠鋪裝備</button>
      <button onclick="openPets()">🐾 戰寵夥伴</button>
      <button onclick="openGacha()">🔮 祈願抽卡</button>
      <button onclick="openDaily()" style="grid-column: span 2;">📅 每日簽到</button>
    </div>
  </div>

  <!-- 3. 地圖選擇畫面 -->
  <div id="mapScreen" class="screen">
    <h3>🗺️ 選擇地城關卡</h3>
    <div id="mapNodes" style="display: flex; flex-direction: column; gap: 8px; margin-top: 12px;"></div>
    <button onclick="showScreen('lobbyScreen')" style="margin-top: auto;">返回大廳</button>
  </div>

  <!-- 4. 角色與鐵匠鋪 -->
  <div id="roleScreen" class="screen">
    <h3 id="roleTitle">殿堂騎士階級</h3>
    <p id="roleDesc" style="color:#aaa; font-size:0.9rem; margin-bottom:12px;"></p>
    <button onclick="upgradeRole()" style="margin-bottom: 12px;">進階提升階級</button>
    <h4>🛡️ 裝備強化</h4>
    <div id="shopItems" style="margin-top: 8px;"></div>
    <button onclick="showScreen('lobbyScreen')" style="margin-top: auto;">返回大廳</button>
  </div>

  <!-- 5. 戰寵畫面 -->
  <div id="petScreen" class="screen">
    <h3>🐾 戰寵夥伴</h3>
    <div id="petList" style="margin-top: 12px;"></div>
    <button onclick="showScreen('lobbyScreen')" style="margin-top: auto;">返回大廳</button>
  </div>

  <!-- 6. 抽卡畫面 -->
  <div id="gachaScreen" class="screen" style="text-align: center;">
    <h3>🔮 聖光祭壇祈願</h3>
    <p style="color:#aaa; margin: 12px 0;">消耗 300 🪙 隨機召喚戰寵夥伴</p>
    <button onclick="drawGacha()">進行祈願 (300🪙)</button>
    <div id="gachaResult" style="margin-top: 24px; font-size: 1.1rem; font-weight: bold;"></div>
    <button onclick="showScreen('lobbyScreen')" style="margin-top: auto;">返回大廳</button>
  </div>

  <!-- 7. 每日簽到 -->
  <div id="dailyScreen" class="screen">
    <h3>📅 每日簽到獎勵</h3>
    <div id="dailyList" style="margin: 12px 0;"></div>
    <button onclick="claimDaily()">領取今日獎勵</button>
    <button onclick="showScreen('lobbyScreen')" style="margin-top: auto;">返回大廳</button>
  </div>

  <!-- 8. 戰鬥遊戲畫面 -->
  <div id="gameScreen" class="screen">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <h3 id="stageText">地城 STAGE 1</h3>
      <span id="battlePetLabel" style="font-size:0.9rem; color:var(--primary);"></span>
    </div>
    
    <div class="battle-container">
      <video id="webcam" playsinline></video>
      <canvas id="canvas"></canvas>
    </div>

    <div style="margin-bottom: 8px;">
      <div style="display: flex; justify-content: space-between;">
        <span id="cameraStatus">🛡️ 領主血條</span>
        <span id="hpText">100 / 100</span>
      </div>
      <div class="hp-bar-bg"><div id="hpFill" class="hp-bar-fill"></div></div>
    </div>

    <div id="floatingText" class="floating-dmg"></div>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <span id="combo" style="color: var(--accent); font-weight: bold;">COMBO x0</span>
      <span id="battleWeaponText" style="font-size:0.85rem; color:#aaa;"></span>
    </div>
    <div id="debug" style="font-size: 0.8rem; color: #64748b; text-align: center;">膝蓋角度：0° (偵測中)</div>

    <button onclick="showScreen('mapScreen')" style="margin-top: auto; background: #ef4444;">撤退離開</button>
  </div>
</div>

<!-- Firebase SDK (v9 相容模式) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<!-- 主程式腳本 -->
<script src="main.js"></script>

</body>
</html>
