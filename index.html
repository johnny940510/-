<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SQUAT HERO</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="app">
        <section id="start-screen" class="screen active">
            <div class="welcome-box">
                <h1 class="title">🏋️ SQUAT HERO</h1>
                <div class="card">
                    <p style="font-size: 14px; color: #94a3b8; margin-bottom: 10px;">請確保手機橫放或有足夠空間後退</p>
                    <input id="p-name" class="name-input" type="text" placeholder="你的名字">
                    <button id="start-btn" class="btn">開始冒險</button>
                </div>
            </div>
        </section>

        <section id="game-screen" class="screen">
            <div class="camera-section">
                <div class="camera-container">
                    <video id="webcam" playsinline muted autoplay></video>
                    <canvas id="output_canvas"></canvas>
                    <div id="hint-display">載入中...</div>
                </div>
            </div>
            <div class="stats-section">
                <div class="stats-grid">
                    <div class="stat-item"><span class="label">STAGE</span><span id="ui-stage" class="value">1</span></div>
                    <div class="stat-item"><span class="label">SCORE</span><span id="ui-score" class="value">0</span></div>
                    <div class="stat-item"><span class="label">COUNT</span><span id="ui-count" class="value">0</span></div>
                </div>
            </div>
            <div class="battle-section">
                <div class="battle-stage">
                    <div id="player" class="character">👤</div>
                    <div id="monster" class="character">👾</div>
                    <div id="dmg-text" class="damage">-20</div>
                </div>
                <div class="hp-container">
                    <div class="hp-bar"><div id="hp-fill"></div></div>
                    <p id="hp-label">BOSS HP: 100/100</p>
                </div>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
