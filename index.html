<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>健身英雄：深蹲傳說</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils"></script>
    <style>
        :root { --primary: #4ade80; --danger: #ef4444; --bg: #0f172a; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: white; font-family: system-ui, sans-serif; overflow: hidden; }
        
        .app { max-width: 800px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        .screen { display: none; flex-direction: column; height: 100%; }
        .screen.active { display: flex; }

        /* 卡片設計 */
        .card { background: rgba(30, 41, 59, 0.8); border-radius: 20px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 15px; }
        
        /* 戰鬥區域 */
        .battle-stage { position: relative; height: 200px; background: linear-gradient(180deg, #1e293b 0%, #020617 100%); border-radius: 15px; overflow: hidden; border: 2px solid #334155; }
        .character { position: absolute; bottom: 20px; font-size: 60px; transition: all 0.2s; }
        #player { left: 40px; }
        #monster { right: 40px; }
        
        /* 數值面板 */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .stat-item { background: #1e293b; padding: 10px; border-radius: 12px; text-align: center; border: 1px solid #334155; }
        .stat-label { font-size: 11px; color: #94a3b8; display: block; }
        .stat-value { font-size: 20px; color: #facc15; font-weight: bold; }

        /* 血條 */
        .hp-bar { width: 100%; height: 12px; background: #334155; border-radius: 6px; overflow: hidden; margin: 10px 0; }
        #hp-fill { width: 100%; height: 100%; background: linear-gradient(90deg, var(--danger), #f87171); transition: width 0.3s; }

        /* 相機 */
        .camera-container { position: relative; width: 100%; aspect-ratio: 4/3; background: #000; border-radius: 15px; overflow: hidden; }
        video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        /* 過場動畫 */
        #level-overlay { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; 
            display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; 
        }
        
        .btn { width: 100%; padding: 16px; background: var(--primary); color: #000; border: none; border-radius: 50px; font-weight: bold; font-size: 18px; cursor: pointer; }
        .name-input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #334155; background: #1e293b; color: white; margin: 20px 0; }

        .damage { position: absolute; right: 80px; top: 40px; color: var(--danger); font-weight: 800; font-size: 32px; opacity: 0; pointer-events: none; }
        .hit { animation: hitAnim 0.5s forwards; }
        @keyframes hitAnim { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-40px); } }
    </style>
</head>
<body>
    <div class="app">
        <!-- 開始畫面 -->
        <section id="start-screen" class="screen active">
            <h1 style="text-align:center; color:var(--primary)">SQUAT HERO</h1>
            <div class="card" style="margin-top:auto">
                <h2>勇者，請輸入稱號</h2>
                <input id="p-name" class="name-input" type="text" placeholder="例如：深蹲狂魔">
                <button onclick="startGame()" class="btn">開始冒險</button>
            </div>
        </section>

        <!-- 遊戲主畫面 -->
        <section id="game-screen" class="screen">
            <div class="stats-grid">
                <div class="stat-item"><span class="stat-label">STAGE</span><span id="ui-stage" class="stat-value">1</span></div>
                <div class="stat-item"><span class="stat-label">SCORE</span><span id="ui-score" class="stat-value">0</span></div>
                <div class="stat-item"><span class="stat-label">COUNT</span><span id="ui-count" class="stat-value">0</span></div>
            </div>

            <div class="battle-stage">
                <div id="player" class="character">👤</div>
                <div id="monster" class="character">👾</div>
                <div id="dmg-text" class="damage">-20</div>
            </div>
            <div class="hp-bar"><div id="hp-fill"></div></div>
            <p id="hp-label" style="text-align:center; font-size:12px; margin-bottom:15px">BOSS HP: 100/100</p>

            <div class="camera-container">
                <video id="webcam" playsinline></video>
                <canvas id="output_canvas"></canvas>
            </div>
            
            <div class="card" style="margin-top:10px; padding:10px; text-align:center">
                <span id="hint-text" style="color:var(--primary)">等待相機開啟...</span>
            </div>
        </section>

        <!-- 過場/結果畫面 -->
        <div id="level-overlay">
            <h3 id="lv-sub">NEXT STAGE</h3>
            <h1 id="lv-main" style="color:var(--primary); font-size:48px">森林史萊姆</h1>
            <p id="lv-desc">深蹲 5 次來擊敗它！</p>
            <h2 id="lv-countdown" style="font-size:60px">3</h2>
        </div>
    </div>

    <script>
        // 遊戲設定
        let state = {
            name: "", score: 0, count: 0, stage: 1, 
            hp: 100, maxHp: 100, targetCount: 5,
            isSquat: false
        };

        const monsters = [
            { name: "森林史萊姆", icon: "👾", hp: 100, target: 5 },
            { name: "深蹲骷髏兵", icon: "💀", hp: 200, target: 10 },
            { name: "大腿筋肉龍", icon: "🦖", hp: 500, target: 20 }
        ];

        // 啟動遊戲
        function startGame() {
            state.name = document.getElementById('p-name').value || "無名勇者";
            document.getElementById('start-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            startCamera();
            initLevel();
        }

        // 初始化關卡
        function initLevel() {
            const m = monsters[Math.min(state.stage - 1, monsters.length - 1)];
            state.hp = m.hp;
            state.maxHp = m.hp;
            state.targetCount = m.target;
            
            // 顯示過場
            const overlay = document.getElementById('level-overlay');
            document.getElementById('lv-main').innerText = m.name;
            document.getElementById('lv-desc').innerText = `達成 ${m.target} 次深蹲以擊敗對手`;
            document.getElementById('monster').innerText = m.icon;
            overlay.style.display = 'flex';

            let timer = 3;
            const cd = setInterval(() => {
                timer--;
                document.getElementById('lv-countdown').innerText = timer;
                if(timer <= 0) {
                    clearInterval(cd);
                    overlay.style.display = 'none';
                    document.getElementById('lv-countdown').innerText = "3";
                }
            }, 1000);

            updateUI();
        }

        function updateUI() {
            document.getElementById('ui-stage').innerText = state.stage;
            document.getElementById('ui-score').innerText = state.score;
            document.getElementById('ui-count').innerText = state.count;
            document.getElementById('hp-fill').style.width = (state.hp / state.maxHp * 100) + "%";
            document.getElementById('hp-label').innerText = `BOSS HP: ${state.hp}/${state.maxHp}`;
        }

        // 攻擊效果
        function attack() {
            const dmg = Math.floor(state.maxHp / state.targetCount);
            state.hp -= dmg;
            if(state.hp < 0) state.hp = 0;
            
            // 特效
            const monster = document.getElementById('monster');
            const dmgText = document.getElementById('dmg-text');
            monster.style.transform = "translateX(20px) rotate(15deg)";
            dmgText.innerText = `-${dmg}`;
            dmgText.classList.remove('hit');
            void dmgText.offsetWidth; // 觸發重繪
            dmgText.classList.add('hit');
            
            setTimeout(() => monster.style.transform = "translateX(0)", 150);
            updateUI();

            if(state.hp <= 0) {
                state.stage++;
                setTimeout(initLevel, 1000);
            }
        }

        // AI 偵測部分
        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5 });

        pose.onResults((results) => {
            const canvas = document.getElementById('output_canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            
            ctx.save();
            ctx.clearRect(0,0,canvas.width, canvas.height);
            
            if (results.poseLandmarks) {
                // 繪製骨架
                drawConnectors(ctx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#4ade80', lineWidth: 2});
                
                const hip = results.poseLandmarks[23];
                const knee = results.poseLandmarks[25];
                const ankle = results.poseLandmarks[27];

                // 計算角度
                const angle = calculateAngle(hip, knee, ankle);
                document.getElementById('knee-angle').innerText = `膝蓋角度：${Math.round(angle)}°`;

                // 遊戲邏輯判斷
                if (angle < 110 && !state.isSquat) {
                    state.isSquat = true;
                    document.getElementById('hint-text').innerText = "很好！站起來！";
                    document.getElementById('player').style.transform = "scaleY(0.6)";
                } 
                else if (angle > 150 && state.isSquat) {
                    state.isSquat = false;
                    state.count++;
                    state.score += 50;
                    document.getElementById('hint-text').innerText = "完美深蹲！";
                    document.getElementById('player').style.transform = "scaleY(1)";
                    attack();
                }
            }
            ctx.restore();
        });

        function calculateAngle(a, b, c) {
            const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
            let angle = Math.abs(radians * 180.0 / Math.PI);
            if (angle > 180.0) angle = 360 - angle;
            return angle;
        }

        function startCamera() {
            const video = document.getElementById('webcam');
            const camera = new Camera(video, {
                onFrame: async () => { await pose.send({image: video}); },
                width: 640, height: 480
            });
            camera.start();
            document.getElementById('hint-text').innerText = "請後退，直到全身入鏡";
        }
    </script>
</body>
</html>
