<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>健身英雄：深蹲傳說</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <h1 class="title">🏋️ 健身英雄：深蹲傳說</h1>

        <section id="start-screen" class="screen active">
            <div class="card">
                <h2>冒險者，報上名來</h2>
                <input id="player-name" class="name-input" type="text" placeholder="輸入你的勇者稱號...">
                <button id="start-btn" class="btn">進入戰場</button>
            </div>
        </section>

        <section id="game-screen" class="screen">
            <!-- 關卡過場動畫 -->
            <div id="level-transition" class="level-transition hidden">
                <div class="transition-content">
                    <h3 id="level-small-text">STAGE 1</h3>
                    <h2 id="level-title">森林史萊姆</h2>
                    <p id="level-desc">透過深蹲來發動攻擊！</p>
                    <div id="level-monster" style="font-size: 80px;">👾</div>
                    <p id="level-countdown">3</p>
                </div>
            </div>

            <div class="game-layout">
                <!-- 戰場區域 -->
                <div class="card game-panel">
                    <div class="top-stats">
                        <div class="stat-box"><span>SCORE</span><strong id="score">0</strong></div>
                        <div class="stat-box"><span>COMBO</span><strong id="combo">0</strong></div>
                        <div class="stat-box"><span>COUNT</span><strong id="squat-num">0</strong></div>
                    </div>
                    
                    <div class="battle-area" id="battle-area">
                        <div id="player" class="player">👤</div>
                        <div id="monster" class="monster">👾</div>
                        <div id="damage-text" class="damage-text"></div>
                    </div>

                    <div class="hp-container">
                        <div class="hp-bar">
                            <div id="hp-fill"></div>
                        </div>
                        <p id="hp-text">HP: -- / --</p>
                    </div>
                </div>

                <!-- 相機偵測區域 -->
                <div class="card camera-panel">
                    <div class="camera-box">
                        <video id="video" autoplay playsinline></video>
                        <canvas id="canvas"></canvas>
                    </div>
                    <div class="status-overlay">
                        <p id="status">🔴 初始化中...</p>
                        <p id="hint">請退後，讓全身入鏡</p>
                    </div>
                    <div class="data-grid">
                        <p id="player-display-name">勇者：--</p>
                        <p id="knee-angle">膝蓋角度：--°</p>
                        <p id="depth-status">深度：--</p>
                    </div>
                </div>
            </div>
        </section>

        <section id="result-screen" class="screen">
            <div class="card">
                <h2 id="result-title">戰鬥結束</h2>
                <p id="result-desc"></p>
                <p id="result-score" style="font-size: 24px; color: #facc15;"></p>
                <button id="restart-btn" class="btn">再次挑戰</button>
            </div>
        </section>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
