<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>健身英雄：深蹲傳說</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <h1 class="title">健身英雄：深蹲傳說</h1>

        <section id="start-screen" class="screen active">
            <div class="card">
                <h2>冒險者，報上名來</h2>
                <input id="player-name" class="name-input" type="text" placeholder="輸入名字">
                <button id="start-btn" class="btn">進入戰場</button>
            </div>
        </section>

        <section id="game-screen" class="screen">
            <div id="level-transition" class="hidden">
                <h2 id="level-small-text"></h2>
                <h2 id="level-title"></h2>
                <p id="level-desc"></p>
                <div id="level-monster"></div>
                <p id="level-countdown"></p>
            </div>

            <div class="game-layout">
                <div class="card">
                    <p>得分：<span id="score">0</span> | Combo：<span id="combo">0</span> | 次數：<span id="squat-num">0</span></p>
                    <div id="battle-area" style="position:relative; height:100px; background:#000;">
                        <div id="player">👤</div>
                        <div id="monster">👾</div>
                        <p id="damage-text"></p>
                    </div>
                    <div class="hp-bar" style="background:#334; height:10px;"><div id="hp-fill" style="background:red; width:100%; height:100%;"></div></div>
                    <p id="hp-text">載入中...</p>
                    <p id="count" style="display:none"></p> </div>

                <div class="card">
                    <video id="video" autoplay playsinline style="width:100%; transform: scaleX(-1);"></video>
                    <canvas id="canvas" style="display:none;"></canvas>
                    <p id="status">準備中...</p>
                    <p id="hint">請站好...</p> <p id="player-display-name">玩家：--</p>
                    <p id="knee-angle">角度：--</p>
                    <p id="depth-status">品質：--</p>
                </div>
            </div>
        </section>

        <section id="result-screen" class="screen">
            <div class="card">
                <h2 id="result-title"></h2>
                <p id="result-desc"></p>
                <p id="result-score"></p>
                <button id="restart-btn" class="btn">重新挑戰</button>
            </div>
        </section>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
